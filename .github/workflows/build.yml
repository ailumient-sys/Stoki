name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Preparar carpeta www
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js css js www/

      - name: Agregar plataforma Android
        run: npx cap add android

      - name: Inyectar permisos en AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          PERMISSIONS='    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'

          python3 -c "
          import sys
          manifest_path = '$MANIFEST'
          permissions = '''$PERMISSIONS'''
          with open(manifest_path, 'r') as f:
              content = f.read()
          content = content.replace('<application', permissions + '\n\n    <application', 1)
          with open(manifest_path, 'w') as f:
              f.write(content)
          print('✅ Permisos inyectados en AndroidManifest.xml')
          "

      - name: Copiar iconos y splash
        run: |
          cp -r android-res/mipmap-* android/app/src/main/res/ 2>/dev/null || true
          cp android-res/icon-192.png www/icon-192.png
          cp android-res/icon-512.png www/icon-512.png
          cp android-res/splash.png android/app/src/main/res/drawable/splash.png 2>/dev/null || true
          echo "✅ Iconos copiados"

      - name: Sincronizar
        run: npx cap sync android

      - name: Construir APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Firmar APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: stoki-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Copiar APK con nombre versionado
        run: |
          SRC="${{ steps.sign_app.outputs.signedReleaseFile }}"
          DST="android/app/build/outputs/apk/release/Stoki-build-${{ github.run_number }}.apk"
          cp "$SRC" "$DST"
          echo "APK versionado: $DST"

      - name: Publicar como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stoki build #${{ github.run_number }}
          body: |
            Build automático generado desde el commit ${{ github.sha }}
          files: |
            ${{ steps.sign_app.outputs.signedReleaseFile }}
            android/app/build/outputs/apk/release/Stoki-build-${{ github.run_number }}.apk
          token: ${{ secrets.GITHUB_TOKEN }}
